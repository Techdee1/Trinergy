<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 440" width="1190" height="440" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Deployment topology</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bdb4ac"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b3e"/></marker></defs><rect width="1190" height="440" fill="#0e0c0b"/><text x="20" y="34" fill="#f5f0eb" font-size="24" font-weight="800" text-anchor="start">Deployment topology</text><text x="20" y="58" fill="#bdb4ac" font-size="14.5" font-weight="400" text-anchor="start">The repository deploys nothing by itself. Hosted URLs are placeholders (TODO-URL). See web/DEPLOY.md.</text><rect x="20" y="90" width="210" height="110" rx="12" fill="#1c1917" stroke="#b9b0a8" stroke-width="2"/><text x="125.0" y="131.0" text-anchor="middle" fill="#f5f0eb" font-size="22" font-weight="700">Browser</text><text x="125.0" y="153.0" text-anchor="middle" fill="#bdb4ac" font-size="16">presenter, judge</text><text x="125.0" y="172.0" text-anchor="middle" fill="#bdb4ac" font-size="16">or engineer</text><rect x="300" y="90" width="250" height="110" rx="12" fill="#1c1917" stroke="#fe0000" stroke-width="2"/><text x="425.0" y="131.0" text-anchor="middle" fill="#f5f0eb" font-size="22" font-weight="700">Static site</text><text x="425.0" y="153.0" text-anchor="middle" fill="#bdb4ac" font-size="16">React + three.js</text><text x="425.0" y="172.0" text-anchor="middle" fill="#bdb4ac" font-size="16">Vercel (TODO-URL)</text><rect x="640" y="90" width="280" height="110" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="780.0" y="131.0" text-anchor="middle" fill="#f5f0eb" font-size="22" font-weight="700">API</text><text x="780.0" y="153.0" text-anchor="middle" fill="#bdb4ac" font-size="16">FastAPI, one worker</text><text x="780.0" y="172.0" text-anchor="middle" fill="#bdb4ac" font-size="16">Render (TODO-URL)</text><rect x="1010" y="90" width="160" height="110" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="1090.0" y="131.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">OpenRouter</text><text x="1090.0" y="153.0" text-anchor="middle" fill="#bdb4ac" font-size="16">holds the only</text><text x="1090.0" y="172.0" text-anchor="middle" fill="#bdb4ac" font-size="16">key</text><path d="M230 145 L296 145" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="263" y="132" text-anchor="middle" fill="#bdb4ac" font-size="14">load</text><path d="M550 145 L636 145" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="593" y="132" text-anchor="middle" fill="#bdb4ac" font-size="14">HTTPS</text><path d="M920 145 L1006 145" stroke="#c9a2ff" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="963" y="132" text-anchor="middle" fill="#c9a2ff" font-size="14">uncached</text><rect x="20" y="240" width="210" height="150" rx="12" fill="#151311" stroke="#4fd8a8" stroke-width="2"/><text x="125.0" y="285.0" text-anchor="middle" fill="#f5f0eb" font-size="18" font-weight="700">Security</text><text x="125.0" y="307.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">key only on API host</text><text x="125.0" y="326.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">never returned or logged</text><text x="125.0" y="345.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">CORS allow-list</text><text x="125.0" y="364.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">$3 limit on the key</text><rect x="300" y="240" width="250" height="150" rx="12" fill="#151311" stroke="#f2b544" stroke-width="2"/><text x="425.0" y="285.0" text-anchor="middle" fill="#f5f0eb" font-size="18" font-weight="700">Offline fallback</text><text x="425.0" y="307.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">same API on the laptop</text><text x="425.0" y="326.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">vite preview, ?api=localhost</text><text x="425.0" y="345.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">notebook, no key, 10 s</text><text x="425.0" y="364.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">72 questions from cache</text><rect x="640" y="240" width="280" height="150" rx="12" fill="#151311" stroke="#7db2ff" stroke-width="2"/><text x="780.0" y="285.0" text-anchor="middle" fill="#f5f0eb" font-size="18" font-weight="700">Inside the API</text><text x="780.0" y="307.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">frozen pipeline</text><text x="780.0" y="326.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">data pack 7.5 MB</text><text x="780.0" y="345.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">caches: committed, unseen, runtime</text><text x="780.0" y="364.0" text-anchor="middle" fill="#bdb4ac" font-size="14.5">guards: limits, budget, timeout</text><path d="M780 202 L780 236" stroke="#7db2ff" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="20" y="424" fill="#9a918a" font-size="13" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Sources: web/DEPLOY.md, web/render.yaml, web/server/API.md, web/app/README.md</text></svg>