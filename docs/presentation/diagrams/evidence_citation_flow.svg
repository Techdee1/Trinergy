<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 770" width="1590" height="770" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Evidence record and citation flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bdb4ac"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b3e"/></marker></defs><rect width="1590" height="770" fill="#0e0c0b"/><text x="40" y="54" fill="#f5f0eb" font-size="30" font-weight="800" text-anchor="start">One fact, one ID, one citation</text><rect x="40" y="100" width="420" height="200" rx="12" fill="#1c1917" stroke="#b9b0a8" stroke-width="2"/><text x="250.0" y="207.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="60" y="132" fill="#b9b0a8" font-size="15" font-weight="700" text-anchor="start">XML (source of truth)</text><text x="60" y="164" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;fluid&gt;</text><text x="60" y="188" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  &lt;type&gt;NaCl brine&lt;/type&gt;</text><text x="60" y="212" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  &lt;locationSample&gt;Active pit&lt;/locationSample&gt;</text><text x="60" y="236" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  &lt;density uom="g/cm3"&gt;1.03&lt;/density&gt;</text><text x="60" y="260" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;/fluid&gt;</text><rect x="540" y="100" width="450" height="200" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="765.0" y="207.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="560" y="132" fill="#4fd8a8" font-size="15" font-weight="700" text-anchor="start">Evidence record</text><text x="560" y="162" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">id       F1C-20140326-FLUID-01</text><text x="560" y="184" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">well     15/9-F-1-C</text><text x="560" y="206" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">report   2014-03-26 (D-1 to D)</text><text x="560" y="228" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">field    density = 1.03 g/cm3</text><text x="560" y="250" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">pdf      15_9_F_1_C_2014_03_26.pdf p.1</text><text x="560" y="272" fill="#f5f0eb" font-size="14" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">section  Drilling Fluid</text><path d="M462 200 L536 200" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="499" y="186" fill="#9a918a" font-size="13" font-weight="400" text-anchor="middle">parser</text><rect x="1070" y="100" width="480" height="200" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="1310.0" y="207.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="1090" y="132" fill="#c9a2ff" font-size="15" font-weight="700" text-anchor="start">Line the model sees</text><text x="1090" y="166" fill="#f5f0eb" font-size="13.5" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">[F1C-20140326-FLUID-01] fluid |</text><text x="1090" y="190" fill="#f5f0eb" font-size="13.5" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">density=1.03 g/cm3; type=NaCl brine;</text><text x="1090" y="214" fill="#f5f0eb" font-size="13.5" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">locationSample=Active pit; md=4094 m</text><text x="1090" y="238" fill="#f5f0eb" font-size="13.5" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">| report 2014-03-26</text><text x="1090" y="262" fill="#f5f0eb" font-size="13.5" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">| at 2014-03-25T21:00:00</text><path d="M992 200 L1066 200" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="1029" y="186" fill="#9a918a" font-size="13" font-weight="400" text-anchor="middle">context</text><rect x="40" y="380" width="440" height="120" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="260.0" y="426.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Model answers</text><text x="260.0" y="448.0" text-anchor="middle" fill="#bdb4ac" font-size="15">1.03 g/cm3</text><text x="260.0" y="467.0" text-anchor="middle" fill="#bdb4ac" font-size="15">cited_ids: F1C-20140326-FLUID-01</text><rect x="560" y="380" width="440" height="120" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="780.0" y="426.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Verifier</text><text x="780.0" y="448.0" text-anchor="middle" fill="#bdb4ac" font-size="15">1.03 is in the cited record</text><text x="780.0" y="467.0" text-anchor="middle" fill="#bdb4ac" font-size="15">the ID was in the context</text><rect x="1080" y="380" width="470" height="120" rx="12" fill="#1c1917" stroke="#fe0000" stroke-width="2"/><text x="1315.0" y="434.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Writer builds the evidence string</text><text x="1315.0" y="456.0" text-anchor="middle" fill="#bdb4ac" font-size="15">from the store, never from model text</text><path d="M482 440 L556 440" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M1002 440 L1076 440" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="1310" y="340" fill="#c9a2ff" font-size="15" font-weight="400" text-anchor="middle">The model may cite only IDs it was shown.</text><path d="M1310 302 L1310 326" stroke="#c9a2ff" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="40" y="580" width="1510" height="160" rx="12" fill="#151311" stroke="#fe0000" stroke-width="2"/><text x="795.0" y="667.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="70" y="618" fill="#ff4b3e" font-size="15" font-weight="700" text-anchor="start">predictions.csv, evidence column</text><text x="70" y="652" fill="#f5f0eb" font-size="17" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">15_9_F_1_C_2014_03_26.pdf p.1 (Drilling Fluid); 15_9_F_1_C_2014_03_26.xml F1C-20140326-FLUID-01</text><text x="70" y="688" fill="#bdb4ac" font-size="16" font-weight="400" text-anchor="start">A reviewer opens the PDF at page 1, finds the Drilling Fluid table, and opens the XML at the same ID.</text><text x="70" y="716" fill="#bdb4ac" font-size="16" font-weight="400" text-anchor="start">If the PDF never prints a value (for example tightWell), the evidence cites the XML only and says so.</text><path d="M1315 502 L1315 576" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/></svg>