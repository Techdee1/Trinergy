<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 760" width="1420" height="760" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>End-to-end pipeline</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bdb4ac"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b3e"/></marker></defs><rect width="1420" height="760" fill="#0e0c0b"/><text x="40" y="54" fill="#f5f0eb" font-size="30" font-weight="800" text-anchor="start">From question to cited answer</text><text x="40" y="82" fill="#bdb4ac" font-size="16" font-weight="400" text-anchor="start">Code finds the facts. The model only phrases them. A verifier checks every answer. Abstaining is a valid answer.</text><text x="40" y="130" fill="#9a918a" font-size="13" font-weight="700" text-anchor="start">BUILD ONCE (offline, from the organiser files)</text><rect x="40" y="144" width="200" height="84" rx="12" fill="#1c1917" stroke="#b9b0a8" stroke-width="2"/><text x="140.0" y="172.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">XML + PDF</text><text x="140.0" y="194.0" text-anchor="middle" fill="#bdb4ac" font-size="15">32 daily reports</text><text x="140.0" y="213.0" text-anchor="middle" fill="#bdb4ac" font-size="15">54 PDF pages</text><rect x="300" y="144" width="200" height="84" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="400.0" y="180.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Parser</text><text x="400.0" y="202.0" text-anchor="middle" fill="#bdb4ac" font-size="15">WITSML to records</text><rect x="560" y="144" width="200" height="84" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="660.0" y="172.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Page locator</text><text x="660.0" y="194.0" text-anchor="middle" fill="#bdb4ac" font-size="15">record to PDF page,</text><text x="660.0" y="213.0" text-anchor="middle" fill="#bdb4ac" font-size="15">section, box</text><rect x="820" y="144" width="260" height="84" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="950.0" y="172.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Evidence store</text><text x="950.0" y="194.0" text-anchor="middle" fill="#bdb4ac" font-size="15">1,783 records,</text><text x="950.0" y="213.0" text-anchor="middle" fill="#bdb4ac" font-size="15">each with a stable ID</text><path d="M240 186 L296 186" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M500 186 L556 186" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M760 186 L816 186" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="40" y="282" fill="#9a918a" font-size="13" font-weight="700" text-anchor="start">PER QUESTION</text><rect x="40" y="296" width="170" height="84" rx="12" fill="#1c1917" stroke="#fe0000" stroke-width="2"/><text x="125.0" y="332.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Question</text><text x="125.0" y="354.0" text-anchor="middle" fill="#bdb4ac" font-size="15">any wording</text><rect x="250" y="296" width="190" height="84" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="345.0" y="324.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Router</text><text x="345.0" y="346.0" text-anchor="middle" fill="#bdb4ac" font-size="15">wells, dates, topics</text><text x="345.0" y="365.0" text-anchor="middle" fill="#bdb4ac" font-size="15">mode + confidence</text><rect x="480" y="296" width="210" height="84" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="585.0" y="324.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Context builder</text><text x="585.0" y="346.0" text-anchor="middle" fill="#bdb4ac" font-size="15">evidence lines, window</text><text x="585.0" y="365.0" text-anchor="middle" fill="#bdb4ac" font-size="15">notes, aggregates, ABSENT</text><rect x="730" y="296" width="190" height="84" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="825.0" y="324.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Model</text><text x="825.0" y="346.0" text-anchor="middle" fill="#bdb4ac" font-size="15">Haiku 5.5, twice</text><text x="825.0" y="365.0" text-anchor="middle" fill="#bdb4ac" font-size="15">JSON only</text><rect x="960" y="296" width="190" height="84" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="1055.0" y="332.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Verifier</text><text x="1055.0" y="354.0" text-anchor="middle" fill="#bdb4ac" font-size="15">13 code checks</text><rect x="1190" y="296" width="190" height="84" rx="12" fill="#1c1917" stroke="#fe0000" stroke-width="2"/><text x="1285.0" y="324.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Writer</text><text x="1285.0" y="346.0" text-anchor="middle" fill="#bdb4ac" font-size="15">predictions.csv</text><text x="1285.0" y="365.0" text-anchor="middle" fill="#bdb4ac" font-size="15">evidence strings</text><path d="M210 338 L246 338" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M440 338 L476 338" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M690 338 L726 338" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M920 338 L956 338" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M1150 338 L1186 338" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M950 228 L345 292" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="760" y="276" fill="#9a918a" font-size="14" font-weight="400" text-anchor="middle">per-question steps read the store</text><text x="40" y="450" fill="#9a918a" font-size="13" font-weight="700" text-anchor="start">WHEN THE VERIFIER OBJECTS</text><rect x="730" y="470" width="190" height="80" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="825.0" y="496.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Escalate</text><text x="825.0" y="518.0" text-anchor="middle" fill="#bdb4ac" font-size="15">Sonnet 5.5, with the</text><text x="825.0" y="537.0" text-anchor="middle" fill="#bdb4ac" font-size="15">verifier message</text><rect x="960" y="470" width="190" height="80" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="1055.0" y="496.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Arbitrate</text><text x="1055.0" y="518.0" text-anchor="middle" fill="#bdb4ac" font-size="15">when the two Haiku</text><text x="1055.0" y="537.0" text-anchor="middle" fill="#bdb4ac" font-size="15">runs disagree</text><rect x="480" y="470" width="210" height="80" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="585.0" y="496.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Second pass</text><text x="585.0" y="518.0" text-anchor="middle" fill="#bdb4ac" font-size="15">multi-report only:</text><text x="585.0" y="537.0" text-anchor="middle" fill="#bdb4ac" font-size="15">enriched context</text><rect x="1190" y="470" width="190" height="80" rx="12" fill="#1c1917" stroke="#f2b544" stroke-width="2"/><text x="1285.0" y="496.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Abstain</text><text x="1285.0" y="518.0" text-anchor="middle" fill="#bdb4ac" font-size="15">ABSENT record says</text><text x="1285.0" y="537.0" text-anchor="middle" fill="#bdb4ac" font-size="15">what was searched</text><path d="M1055 380 L825 468" stroke="#f2b544" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="960" y="440" text-anchor="middle" fill="#f2b544" font-size="14">fail</text><path d="M920 510 L956 510" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M605 468 L605 384" stroke="#7db2ff" stroke-width="2.4" fill="none" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="650" y="430" text-anchor="middle" fill="#7db2ff" font-size="14">retry once</text><path d="M1285 384 L1285 466" stroke="#f2b544" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="1275" y="426" fill="#f2b544" font-size="14" font-weight="400" text-anchor="end">no support in the archive</text><text x="40" y="620" fill="#9a918a" font-size="13" font-weight="700" text-anchor="start">WHERE THE ANSWER GOES</text><rect x="40" y="636" width="300" height="76" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="190.0" y="668.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Notebook</text><text x="190.0" y="690.0" text-anchor="middle" fill="#bdb4ac" font-size="15">solution.ipynb, offline by default</text><rect x="380" y="636" width="300" height="76" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="530.0" y="668.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Answer cache</text><text x="530.0" y="690.0" text-anchor="middle" fill="#bdb4ac" font-size="15">llm_cache.json, same keys every run</text><rect x="720" y="636" width="300" height="76" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="870.0" y="668.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Backend API</text><text x="870.0" y="690.0" text-anchor="middle" fill="#bdb4ac" font-size="15">FastAPI, traces every stage</text><rect x="1060" y="636" width="320" height="76" rx="12" fill="#1c1917" stroke="#fe0000" stroke-width="2"/><text x="1220.0" y="668.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700">Dashboard</text><text x="1220.0" y="690.0" text-anchor="middle" fill="#bdb4ac" font-size="15">answer, evidence page, replay, 3D</text><path d="M680 674 L716 674" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M1020 674 L1056 674" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M340 674 L376 674" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/></svg>