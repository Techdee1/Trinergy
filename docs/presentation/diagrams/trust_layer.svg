<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 345" width="1190" height="345" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Trust layer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bdb4ac"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b3e"/></marker></defs><rect width="1190" height="345" fill="#0e0c0b"/><text x="10" y="28" fill="#f5f0eb" font-size="22" font-weight="800" text-anchor="start">The trust layer: nothing reaches predictions.csv unchecked</text><rect x="10" y="130" width="150" height="90" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="85.0" y="161.0" text-anchor="middle" fill="#f5f0eb" font-size="17" font-weight="700">Model reply</text><text x="85.0" y="183.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">status, answer,</text><text x="85.0" y="202.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">cited_ids, rationale</text><rect x="200" y="60" width="350" height="250" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="375.0" y="131.0" text-anchor="middle" fill="#f5f0eb" font-size="18" font-weight="700">Verifier: 13 checks in code</text><text x="375.0" y="153.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">valid JSON, status, answer text</text><text x="375.0" y="172.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">citation shape, ID was shown to the model</text><text x="375.0" y="191.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">a citation is required</text><text x="375.0" y="210.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">abstain cites only ABSENT records</text><text x="375.0" y="229.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">numbers, units, dates, times supported</text><text x="375.0" y="248.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">no false not-found, parts answered</text><text x="375.0" y="267.0" text-anchor="middle" fill="#bdb4ac" font-size="13.5">no missed evidence</text><path d="M160 175 L196 175" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="610" y="44" width="330" height="52" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="775.0" y="77.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="775" y="66" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">All checks pass</text><text x="775" y="85" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">accept, then repair citations</text><path d="M552 185 L606 70" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="610" y="104" width="330" height="52" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="775.0" y="137.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="775" y="126" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">Failed, or abstained with a matching line</text><text x="775" y="145" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">escalate to Sonnet 5.5 with the message</text><path d="M552 185 L606 130" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="610" y="164" width="330" height="52" rx="12" fill="#1c1917" stroke="#c9a2ff" stroke-width="2"/><text x="775.0" y="197.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="775" y="186" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">The two Haiku runs disagree</text><text x="775" y="205" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">Sonnet arbitrates, one retry</text><path d="M552 185 L606 190" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="610" y="224" width="330" height="52" rx="12" fill="#1c1917" stroke="#7db2ff" stroke-width="2"/><text x="775.0" y="257.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="775" y="246" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">Abstain or partial on multi-report</text><text x="775" y="265" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">second pass, enriched context</text><path d="M552 185 L606 250" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="610" y="284" width="330" height="52" rx="12" fill="#1c1917" stroke="#f2b544" stroke-width="2"/><text x="775.0" y="317.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="775" y="306" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">No such field in the archive</text><text x="775" y="325" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">abstain and cite the ABSENT record</text><path d="M552 185 L606 310" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="990" y="44" width="190" height="52" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="1085.0" y="77.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="1085" y="66" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">Citation repair</text><text x="1085" y="85" fill="#bdb4ac" font-size="12.5" font-weight="400" text-anchor="middle">adds records the answer uses</text><path d="M942 70 L986 70" stroke="#bdb4ac" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="990" y="150" width="190" height="90" rx="12" fill="#1c1917" stroke="#f2b544" stroke-width="2"/><text x="1085.0" y="202.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="1085" y="176" fill="#f5f0eb" font-size="14.5" font-weight="700" text-anchor="middle">Still failing?</text><text x="1085" y="197" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">keep the first answer,</text><text x="1085" y="214" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">flag it for review,</text><text x="1085" y="231" fill="#bdb4ac" font-size="13" font-weight="400" text-anchor="middle">confidence 0.2</text><path d="M942 130 L986 175" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M942 190 L986 200" stroke="#9a918a" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="10" y="332" fill="#9a918a" font-size="13" font-weight="400" text-anchor="start">Confidence is set by rules, never by the model. Source: submission/archive_qa/verify.py</text></svg>