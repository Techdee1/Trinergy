<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 740" width="1480" height="740" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Date window trap</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bdb4ac"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b3e"/></marker></defs><rect width="1480" height="740" fill="#0e0c0b"/><text x="40" y="54" fill="#f5f0eb" font-size="30" font-weight="800" text-anchor="start">The date-window trap: report D covers D-1 to D</text><text x="40" y="84" fill="#bdb4ac" font-size="16" font-weight="400" text-anchor="start">Example: question T2-016 asks about the sample on 2014-03-26. The sample is stamped 2014-03-25 at 21:00.</text><line x1="120" y1="300" x2="1360" y2="300" stroke="#5a524c" stroke-width="3"/><rect x="420" y="240" width="600" height="120" rx="10" fill="#4fd8a8" fill-opacity="0.10" stroke="#4fd8a8" stroke-width="2"/><text x="720" y="228" fill="#4fd8a8" font-size="17" font-weight="700" text-anchor="middle">Report dated 2014-03-26 covers this window</text><line x1="420" y1="224" x2="420" y2="376" stroke="#4fd8a8" stroke-width="3"/><text x="420" y="404" fill="#f5f0eb" font-size="17" font-weight="700" text-anchor="middle">2014-03-25</text><text x="420" y="426" fill="#bdb4ac" font-size="15" font-weight="400" text-anchor="middle">00:00</text><line x1="1020" y1="224" x2="1020" y2="376" stroke="#4fd8a8" stroke-width="3"/><text x="1020" y="404" fill="#f5f0eb" font-size="17" font-weight="700" text-anchor="middle">2014-03-26</text><text x="1020" y="426" fill="#bdb4ac" font-size="15" font-weight="400" text-anchor="middle">00:00</text><circle cx="945.0" cy="300" r="12" fill="#c9a2ff"/><text x="945.0" y="276" fill="#c9a2ff" font-size="16" font-weight="700" text-anchor="middle">NaCl brine sample</text><text x="945.0" y="338" fill="#f5f0eb" font-size="15" font-weight="400" text-anchor="middle">2014-03-25 21:00</text><rect x="120" y="440" width="560" height="200" rx="12" fill="#1c1917" stroke="#f2b544" stroke-width="2"/><text x="400.0" y="547.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="144" y="476" fill="#f2b544" font-size="18" font-weight="700" text-anchor="start">What goes wrong</text><text x="144" y="510" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">The question says 2014-03-26.</text><text x="144" y="538" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">The record says 2014-03-25T21:00.</text><text x="144" y="566" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">Large models read that as a mismatch and abstain.</text><text x="144" y="594" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">In the benchmark, date-window cases scored 12 percent overall.</text><rect x="760" y="440" width="600" height="200" rx="12" fill="#25211e" stroke="#4fd8a8" stroke-width="2"/><text x="1060.0" y="547.0" text-anchor="middle" fill="#f5f0eb" font-size="20" font-weight="700"></text><text x="784" y="476" fill="#4fd8a8" font-size="18" font-weight="700" text-anchor="start">What the pipeline does</text><text x="784" y="510" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">Each record carries its report window.</text><text x="784" y="538" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">When a question names a clock time and a date, a</text><text x="784" y="566" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">WINDOW NOTE says: the D-1 timestamp belongs to report D.</text><text x="784" y="594" fill="#f5f0eb" font-size="16" font-weight="400" text-anchor="start">The verifier accepts dates found in the cited record's window.</text><text x="40" y="700" fill="#9a918a" font-size="13" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Sources: submission/DATA_NOTES.md (Dates), submission/archive_qa/context.py (window_note), tools/llm_bench/RECOMMENDATION.md (local benchmark notes)</text></svg>